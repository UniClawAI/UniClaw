[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "uniclaw"
version = "0.1.0"
description = "LLM-powered intelligent agent system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "croniter>=6.0.0",
    "fastapi>=0.135.1",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "uvicorn>=0.34.0",
    "websockets>=15.0",
    "httpx>=0.28.1",
    "mss>=10.0.0",
    "pillow>=10.0.0",
    "prompt-toolkit>=3.0.0",
    "pyaml>=26.2.1",
    "pyautogui>=0.9.54",
    "python-dotenv>=1.2.2",
    "tiktoken>=0.9.0",
    "qrcode>=8.2",
    "silk-python>=0.2.8",
    "cachetools>=7.1.1",
    "pypdf>=5.0.0",
    "keyboard>=0.13.5",
    "pynput>=1.8.2",
    "pathspec>=1.1.1",
    "mcp>=1.0.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "playwright>=1.40.0",
    "soundfile>=0.14.0",
    "sounddevice>=0.5.0",
    "pyjwt>=2.0.0",
    "uiautomation>=2.0.0; sys_platform == 'win32'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "cython>=3.0.0",
    "setuptools>=82.0.1",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.155.2",
    "mutmut>=3.6.0",
]

[project.scripts]
uniclaw = "uniclaw.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["uniclaw*"]

[tool.setuptools.package-data]
"*" = ["*.png", "*.pyd", "**/*.pyd", "*.so", "**/*.so", "*.dylib", "**/*.dylib"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
