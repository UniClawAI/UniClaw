<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniClaw — 登录</title>
    <link rel="icon" href="/assets/logo.png" type="image/png">
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="auth-card">
        <div class="auth-logo">
            <div style="font-size:48px;margin-bottom:12px">🦞</div>
            <h1>UniClaw</h1>
            <p id="subtitle">智能代理系统</p>
        </div>

        <form class="auth-form" id="authForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" required>
            </div>

            <div class="form-group" id="confirmGroup" style="display:none;">
                <label for="confirmPassword">确认密码</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="再次输入密码" autocomplete="new-password">
            </div>

            <p class="error-msg" id="errorMsg"></p>

            <button type="submit" class="btn-submit" id="submitBtn">登录</button>
        </form>

        <p class="mode-hint" id="modeHint"></p>
    </div>

    <script>
    (function() {
        const form = document.getElementById('authForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const confirmGroup = document.getElementById('confirmGroup');
        const confirmInput = document.getElementById('confirmPassword');
        const submitBtn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMsg');
        const subtitle = document.getElementById('subtitle');
        const modeHint = document.getElementById('modeHint');

        let isRegisterMode = false;

        /** SHA-256 哈希(密码不过明文) — 兼容非安全上下文(HTTP) */
        async function sha256(str) {
            // 优先使用 Web Crypto API (HTTPS/localhost)
            if (window.crypto && crypto.subtle) {
                try {
                    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
                    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
                } catch (_) { /* fallback below */ }
            }
            // 纯 JS fallback (兼容 HTTP 局域网访问)
            function _sha256(msg) {
                function rrot(v, n) { return (v >>> n) | (v << (32 - n)); }
                const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
                    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
                    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
                    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
                    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
                    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
                    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
                    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
                let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
                const bytes = [];
                for (let i = 0; i < msg.length; i++) {
                    let c = msg.charCodeAt(i);
                    if (c < 128) bytes.push(c);
                    else if (c < 2048) { bytes.push(192|(c>>6)); bytes.push(128|(c&63)); }
                    else { bytes.push(224|(c>>12)); bytes.push(128|((c>>6)&63)); bytes.push(128|(c&63)); }
                }
                const bitLen = bytes.length * 8;
                bytes.push(0x80);
                while (bytes.length % 64 !== 56) bytes.push(0);
                for (let i = 56; i >= 0; i -= 8) bytes.push((bitLen / Math.pow(2, i)) & 0xff);
                for (let off = 0; off < bytes.length; off += 64) {
                    const W = new Array(64);
                    for (let i = 0; i < 16; i++) W[i] = (bytes[off+i*4]<<24)|(bytes[off+i*4+1]<<16)|(bytes[off+i*4+2]<<8)|bytes[off+i*4+3];
                    for (let i = 16; i < 64; i++) {
                        const s0 = rrot(W[i-15],7)^rrot(W[i-15],18)^(W[i-15]>>>3);
                        const s1 = rrot(W[i-2],17)^rrot(W[i-2],19)^(W[i-2]>>>10);
                        W[i] = (W[i-16]+s0+W[i-7]+s1)|0;
                    }
                    let [a,b,c,d,e,f,g,h] = H;
                    for (let i = 0; i < 64; i++) {
                        const S1 = rrot(e,6)^rrot(e,11)^rrot(e,25);
                        const ch = (e&f)^((~e)&g);
                        const t1 = (h+S1+ch+K[i]+W[i])|0;
                        const S0 = rrot(a,2)^rrot(a,13)^rrot(a,22);
                        const maj = (a&b)^(a&c)^(b&c);
                        const t2 = (S0+maj)|0;
                        h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
                    }
                    H = [(H[0]+a)|0,(H[1]+b)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
                }
                return H.map(v => (v>>>0).toString(16).padStart(8,'0')).join('');
            }
            return _sha256(str);
        }

        // 检查是否已有账号
        async function checkStatus() {
            try {
                const resp = await fetch('/api/auth/status');
                const data = await resp.json();

                if (data.has_user) {
                    // 登录模式
                    isRegisterMode = false;
                    subtitle.textContent = '智能代理系统';
                    submitBtn.textContent = '登录';
                    confirmGroup.style.display = 'none';
                    confirmInput.required = false;
                    modeHint.textContent = '';
                    document.title = 'UniClaw — 登录';
                } else {
                    // 注册模式(首次)
                    isRegisterMode = true;
                    subtitle.textContent = '首次使用,请创建管理员账号';
                    submitBtn.textContent = '创建账号';
                    confirmGroup.style.display = 'flex';
                    confirmInput.required = true;
                    modeHint.textContent = '';
                    document.title = 'UniClaw — 创建账号';
                }
            } catch (e) {
                errorMsg.textContent = '无法连接到服务器';
            }
        }

        // 提交表单
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            errorMsg.textContent = '';

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                errorMsg.textContent = '请输入用户名和密码';
                return;
            }

            if (isRegisterMode) {
                const confirm = confirmInput.value;
                if (password !== confirm) {
                    errorMsg.textContent = '两次输入的密码不一致';
                    return;
                }
                if (password.length < 6) {
                    errorMsg.textContent = '密码至少 6 位';
                    return;
                }
            }

            submitBtn.disabled = true;
            submitBtn.textContent = isRegisterMode ? '创建中...' : '登录中...';

            try {
                const hashedPwd = await sha256(password);
                const endpoint = isRegisterMode ? '/api/auth/register' : '/api/auth/login';
                const resp = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password: hashedPwd })
                });

                const data = await resp.json();

                if (!resp.ok) {
                    errorMsg.textContent = data.detail || '操作失败';
                    submitBtn.disabled = false;
                    submitBtn.textContent = isRegisterMode ? '创建账号' : '登录';
                    return;
                }

                // 保存 token
                localStorage.setItem('uniclaw_token', data.token);
                // 跳转主页
                window.location.href = '/';

            } catch (e) {
                errorMsg.textContent = '网络错误,请重试';
                submitBtn.disabled = false;
                submitBtn.textContent = isRegisterMode ? '创建账号' : '登录';
            }
        });

        // 页面加载时检查状态
        // 如果已有 token,先验证是否有效
        async function init() {
            const token = localStorage.getItem('uniclaw_token');
            if (token) {
                try {
                    const resp = await fetch('/api/auth/me', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    if (resp.ok) {
                        // token 有效,直接跳转主页
                        window.location.href = '/';
                        return;
                    }
                } catch (e) {
                    // token 无效,继续显示登录页
                }
                localStorage.removeItem('uniclaw_token');
            }
            checkStatus();
        }

        init();
    })();
    </script>
</body>
</html>
